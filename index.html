<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý sinh viên</title>
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--mut:#64707d;--card:#fff;--line:#dde3e9;--acc:#1f6feb;--acc2:#e5efff;--danger:#d1344a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--fg:#e6edf3;--mut:#8b98a5;--card:#171d24;--line:#2a333d;--acc:#4c9aff;--acc2:#16283f;--danger:#ff6b81}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0;font-size:1.7rem}.sub{color:var(--mut);margin:.2em 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat b{display:block;font-size:1.6rem;color:var(--acc)}.stat span{color:var(--mut);font-size:.88rem}
form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px}
input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.row{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.del{color:var(--danger)}button:hover{filter:brightness(.95)}
#msg{color:var(--danger);font-size:.9rem}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.82rem}
.tag{padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:.8rem}
.empty{text-align:center;color:var(--mut);padding:24px}
footer{color:var(--mut);font-size:.85rem;text-align:center;margin-top:24px}
@media(max-width:700px){form{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quản lý sinh viên</h1>
  <p class="sub">Thêm, sửa, xoá và tìm kiếm sinh viên. Dữ liệu lưu trong trình duyệt của bạn.</p>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Tổng số sinh viên</span></div>
    <div class="stat"><b id="sAvg">0</b><span>Điểm trung bình chung</span></div>
    <div class="stat"><b id="sGood">0</b><span>Xếp loại Giỏi trở lên</span></div>
  </div>

  <div class="card">
    <form id="f">
      <label>MSSV<input id="id" required maxlength="20"></label>
      <label>Họ và tên<input id="name" required maxlength="60"></label>
      <label>Lớp<input id="cls" required maxlength="20"></label>
      <label>Ngày sinh<input id="dob" type="date"></label>
      <label>Email<input id="email" type="email" maxlength="60"></label>
      <label>Điểm TB (0-10)<input id="gpa" type="number" min="0" max="10" step="0.01" required></label>
      <div class="row">
        <button class="pri" id="save" type="submit">Thêm sinh viên</button>
        <button id="cancel" type="button" hidden>Huỷ sửa</button>
        <span id="msg"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="bar">
      <input id="q" placeholder="Tìm theo MSSV, họ tên hoặc lớp...">
      <span id="count" class="sub" style="margin:0"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>MSSV</th><th>Họ và tên</th><th>Lớp</th><th>Ngày sinh</th><th>Email</th><th>Điểm TB</th><th>Xếp loại</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <footer>Phiên bản 2 &middot; Deploy tự động bằng GitHub, Jenkins, Vercel</footer>
</div>

<script>
var KEY = 'sv-list';
var $ = function (id) { return document.getElementById(id); };
var editing = null;
var list = load();

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [
    { id: 'SV001', name: 'Nguyễn Văn An', cls: 'CNTT1', dob: '2004-03-12', email: 'an@example.com', gpa: 8.4 },
    { id: 'SV002', name: 'Trần Thị Bình', cls: 'CNTT1', dob: '2004-07-25', email: 'binh@example.com', gpa: 7.1 },
    { id: 'SV003', name: 'Lê Minh Cường', cls: 'CNTT2', dob: '2003-11-02', email: 'cuong@example.com', gpa: 5.6 }
  ];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function rank(g) { return g >= 8 ? 'Giỏi' : g >= 6.5 ? 'Khá' : g >= 5 ? 'Trung bình' : 'Yếu'; }
function fmtDate(d) { if (!d) return ''; var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

function render() {
  var q = $('q').value.trim().toLowerCase();
  var rows = list.filter(function (s) {
    return !q || (s.id + ' ' + s.name + ' ' + s.cls).toLowerCase().indexOf(q) > -1;
  });
  $('tb').innerHTML = rows.length ? rows.map(function (s) {
    return '<tr><td>' + esc(s.id) + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.cls) + '</td><td>' + fmtDate(s.dob) +
      '</td><td>' + esc(s.email) + '</td><td>' + Number(s.gpa).toFixed(2) + '</td><td><span class="tag">' + rank(s.gpa) +
      '</span></td><td><button data-a="edit" data-id="' + esc(s.id) + '">Sửa</button> <button class="del" data-a="del" data-id="' +
      esc(s.id) + '">Xoá</button></td></tr>';
  }).join('') : '<tr><td colspan="8" class="empty">Không có sinh viên nào.</td></tr>';
  $('count').textContent = rows.length + ' kết quả';
  var total = list.length, sum = 0, good = 0;
  list.forEach(function (s) { sum += Number(s.gpa); if (s.gpa >= 8) good++; });
  $('sTotal').textContent = total;
  $('sAvg').textContent = total ? (sum / total).toFixed(2) : '0';
  $('sGood').textContent = good;
}

function resetForm() {
  editing = null;
  $('f').reset();
  $('id').disabled = false;
  $('save').textContent = 'Thêm sinh viên';
  $('cancel').hidden = true;
  $('msg').textContent = '';
}

$('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var s = {
    id: $('id').value.trim(), name: $('name').value.trim(), cls: $('cls').value.trim(),
    dob: $('dob').value, email: $('email').value.trim(), gpa: parseFloat($('gpa').value)
  };
  if (!s.id || !s.name || !s.cls || isNaN(s.gpa) || s.gpa < 0 || s.gpa > 10) {
    $('msg').textContent = 'Vui lòng nhập đủ thông tin, điểm từ 0 đến 10.';
    return;
  }
  if (editing === null) {
    if (list.some(function (x) { return x.id.toLowerCase() === s.id.toLowerCase(); })) {
      $('msg').textContent = 'MSSV đã tồn tại.';
      return;
    }
    list.push(s);
  } else {
    list = list.map(function (x) { return x.id === editing ? s : x; });
  }
  save(); resetForm(); render();
});

$('cancel').addEventListener('click', resetForm);
$('q').addEventListener('input', render);

$('tb').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  var id = b.getAttribute('data-id');
  if (b.getAttribute('data-a') === 'del') {
    if (confirm('Xoá sinh viên ' + id + '?')) {
      list = list.filter(function (x) { return x.id !== id; });
      if (editing === id) resetForm();
      save(); render();
    }
  } else {
    var s = list.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    editing = id;
    $('id').value = s.id; $('id').disabled = true;
    $('name').value = s.name; $('cls').value = s.cls; $('dob').value = s.dob || '';
    $('email').value = s.email || ''; $('gpa').value = s.gpa;
    $('save').textContent = 'Lưu thay đổi';
    $('cancel').hidden = false;
    $('msg').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

render();
</script>
</body>
</html>
